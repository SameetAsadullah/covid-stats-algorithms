name: C++ checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compile application
        run: make

      - name: Verify input data
        run: |
          test -s data/who-covid-19.csv
          test -s data/country-weights.csv

      - name: Check repository hygiene
        run: |
          test ! -d src/.vs
          test ! -d src/Debug
          test -z "$(find . -type f \( -name '*.exe' -o -name '*.obj' -o -name '*.pdb' -o -name '*.ipch' \) -print)"

      - name: Check whitespace
        run: git diff --check
